services:
  app:
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
    build:
      context: .
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
    volumes:
      - .:/app
    command: pytest

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: outreach
      POSTGRES_PASSWORD: outreach
      POSTGRES_DB: outreach
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outreach"]
      interval: 2s
      timeout: 3s
      retries: 15
