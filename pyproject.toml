[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[project]
name = "django-outreach"
version = "0.1.0b4"
description = "Prospects, reusable email templates and bulk mail with unsubscribe links for Django projects."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Mahadi Eric", email = "33723198+Carlstain@users.noreply.github.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "Django>=5.1,<6",
    "django-import-export>=4.2,<5,!=4.3.0",
    "tablib>=3.5,<4",
    "nh3>=0.3,<0.4",
]

[project.urls]
Homepage = "https://github.com/Carlstain/django-outreach"
Source = "https://github.com/Carlstain/django-outreach"
Documentation = "https://django-outreach.readthedocs.io/"
Issues ="https://github.com/Carlstain/django-outreach/issues"
Changelog = "https://github.com/Carlstain/django-outreach/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "factory-boy",
    "ruff==0.16.10",
    "pre-commit",
    "Babel",
    "psycopg[binary]",
]
docs = [
    "sphinx",
    "myst-parser",
    "furo",
    "sphinx-copybutton",
]

[tool.uv.build-backend]
module-name = "outreach"
module-root = "src"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 95
target-version = "py310"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "B", "SIM", "I", "UP"]
ignore = ["E501"]
