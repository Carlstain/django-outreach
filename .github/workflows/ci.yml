name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.23"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen --group dev
      - run: uv lock --check
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        django-version: ["5.1", "5.2"]
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: outreach
          POSTGRES_PASSWORD: outreach
          POSTGRES_DB: outreach
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U outreach"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://outreach:outreach@localhost:5432/outreach' || '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --group dev
      - run: uv pip install "Django~=${{ matrix.django-version }}.0"
      - run: uv run --no-sync pytest

  import-export-floor:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --group dev
      - run: uv pip install "Django~=5.1.0" "django-import-export==4.2.*"
      - run: uv pip list | grep -i "django-import-export"
      - run: uv run --no-sync pytest

  host-variants:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        settings-module: [no_tz, no_i18n, no_escape]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: uv sync --frozen --group dev
      - run: uv run --no-sync pytest --ds=tests.settings.${{ matrix.settings-module }} ${{ matrix.settings-module == 'no_escape' && '--deselect tests/prospects/test_prospect_import.py::ProspectImportTests::test_export_escapes_cells_starting_with_an_equals_sign' || '' }}

  custom-user:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: uv sync --frozen --group dev
      - run: uv run --no-sync pytest tests/host/test_custom_user_model.py --ds=tests.settings.custom_user

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: uv sync --frozen --group dev
      - run: uv run --no-sync python scripts/check_package.py
      - run: scripts/check_wheel_install.sh
      - run: uv run --no-sync bash scripts/check_translations.sh
      - run: uv run --no-sync django-admin makemigrations --check --dry-run outreach
        env:
          DJANGO_SETTINGS_MODULE: tests.settings
          PYTHONPATH: .
