name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  UV_VERSION: "0.12.23"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: Check that the tag matches the package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          package_version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          if [ "v${package_version}" != "${TAG_NAME}" ]; then
            echo "The tag ${TAG_NAME} does not match the package version ${package_version}." >&2
            exit 1
          fi
      - run: uv sync --frozen --group dev
      - run: uv run --no-sync python scripts/check_package.py
      - run: scripts/check_wheel_install.sh
      - run: uv build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/django-outreach
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          awk -v header="## [${version}]" 'index($0, header) == 1 { found = 1; next } found && /^## \[/ { exit } found' CHANGELOG.md > release_notes.md
          if ! grep -q '[^[:space:]]' release_notes.md; then
            echo "CHANGELOG.md has no section for ${version}." >&2
            exit 1
          fi
          prerelease_flag=""
          if [[ "${version}" =~ (a|b|rc)[0-9]+$ ]]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "${TAG_NAME}" dist/* --title "${TAG_NAME}" --notes-file release_notes.md ${prerelease_flag}
