# Labels of the repository, applied by .github/workflows/labels.yml.
# Edit the name here to rename a label; "from_name" keeps its issues.

# Type
- name: bug
  color: d73a4a
  description: Something does not work as documented
- name: enhancement
  color: a2eeef
  description: New feature or change to an existing one
- name: documentation
  color: 0075ca
  description: README, docs/ or the built-in help page
- name: translation
  color: 5319e7
  description: Translation catalogues (.po)
- name: question
  color: d876e3
  description: How to use or configure django-outreach

# Status
- name: needs-triage
  color: fbca04
  description: Not reviewed by a maintainer yet
- name: needs-info
  color: fef2c0
  description: Waiting for more information from the reporter
- name: confirmed
  color: 0e8a16
  description: Reproduced or accepted
- name: duplicate
  color: cfd3d7
  description: Already reported in another issue
- name: wontfix
  color: ffffff
  description: Will not be worked on

# Contributors
- name: good first issue
  color: 7057ff
  description: Small and well defined, good for a first contribution
- name: help wanted
  color: 008672
  description: A contribution is welcome

# Release
- name: breaking-change
  color: b60205
  description: Changes the interface, list it in the changelog
- name: dependencies
  color: ededed
  description: Dependency updates (Dependabot)

# Area
- name: "area: mailing"
  color: c5def5
  description: Sending, Celery dispatch, scheduled send, retries
- name: "area: prospects"
  color: c5def5
  description: Prospects and their history
- name: "area: import/export"
  color: c5def5
  description: CSV import and export
- name: "area: audiences"
  color: c5def5
  description: Audiences
- name: "area: email templates"
  color: c5def5
  description: Email templates, variables, tags and buttons
- name: "area: unsubscribe"
  color: c5def5
  description: Unsubscribe links and the suppression list
- name: "area: gdpr"
  color: c5def5
  description: Data download and erase-and-suppress
- name: "area: admin ui"
  color: c5def5
  description: Outreach admin site, theme and help page
- name: "area: host integration"
  color: c5def5
  description: Settings, signals, URLs and the host project
