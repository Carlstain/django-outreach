name: Documentation
description: Something in the documentation is wrong, unclear or missing.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The URL on Read the Docs, or the file in the repository (README.md, docs/...).
      placeholder: https://django-outreach.readthedocs.io/en/latest/configuration.html
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: Optional. The text you would expect to read.
